server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/user_db
    username: ${vault.user-service.db.username}
    password: ${vault.user-service.db.password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata

  cache:
    type: redis

  data:
    redis:
      host: redis
      port: 6379
      password: ${vault.user-service.redis.password}
      time-to-live: 600000

  kafka:
    bootstrap-servers: ${vault.application.kafka.bootstrap}

#  security:
#    user:
#      name: admin
#      password: ${vault.user-service.admin-password}

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://service-registry:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,trace

  tracing:
    enabled: true
    sampling:
      probability: 1.0

  metrics:
    export:
      otlp:
        enabled: true
        endpoint: http://splunk-otel-collector:4318/v1/metrics
        step: 10s

  otlp:
    logs:
      export:
        enabled: true
        endpoint: http://splunk-otel-collector:4318/v1/logs

logging:
  file:
    name: logs/user-service.json
  level:
    root: INFO
    com.rideshare: INFO
    org.hibernate.SQL: INFO
